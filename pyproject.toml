[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The pure wheel (py3-none-any) is built by setuptools above: the
# always-works fallback (full mirror, no accelerator). The binary
# wheels carrying the compiled `_rust.abi3.so` are built by maturin per
# platform from crates/geometrykit-py, whose own pyproject.toml config
# points at this python/ tree (maturin reads the pyproject next to the
# cargo manifest, not the build-system above). One release publishes
# both routes together.

[project]
name = "geometrykit"
version = "0.4.0"
description = "Geometry primitives and NURBS data model — the geometry substrate for the ifckit family"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-or-later"
license-files = ["COPYING.LESSER", "COPYING"]
authors = [{ name = "Sander Boer" }]
keywords = ["geometry", "nurbs", "vector", "curve", "surface", "splines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
# Pin policy inherited from ifckit: never open-ended; >= min-proven, <= current.
dev = [
    "pytest>=7,<10",
    "pytest-cov>=7,<8",
    "hypothesis>=6,<8",
]

[project.urls]
Homepage = "https://github.com/maucworks/geometrykit"
Changelog = "https://github.com/maucworks/geometrykit/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["python"]
include = ["geometrykit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "oracle: requires pythonocc-core (OCCT golden comparisons; skipped elsewhere)",
    "rust: requires the geometrykit._rust accelerator extension",
]
filterwarnings = [
    # strict on the package's own warnings...
    "error::DeprecationWarning:geometrykit.*",
    # ...except the intentional, documented deprecations. The Polyline
    # deprecation fires with stacklevel=2 (origin reattributed to the caller),
    # hence the message-based ignore rather than the module filter.
    "ignore:Polyline is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["geometrykit"]
branch = true
omit = ["python/geometrykit/geometry/_bridge.py"]

[tool.coverage.report]
show_missing = true
# No global fail_under: the ladder script owns the staged acceptance
# (scripts/coverage_ladder.py) — the OCC-exit milestones raise the floors.

[tool.ruff]
line-length    = 100
target-version = "py39"
# Same convention as ifckit: the promoted legacy test modules are not ruffed.
exclude = ["tests", "wip"]

[tool.ruff.lint]
# E, F, I for now: the Tier-1 ported modules arrive from ifckit's codebase before
# docstring-rule cleanup (D) — D joins the ladder with the M2+ kernel work.
select = ["E", "F", "I"]
