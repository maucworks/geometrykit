[workspace]
resolver = "2"
members = [
    "geometrykit",        # placeholder; claims the registry name
    "geometrykit-core",   # kernels, pure Rust, no pyo3
    "geometrykit-py",     # pyo3/maturin wrapper, marshalling only
]

[workspace.package]
edition = "2021"
license = "LGPL-3.0-or-later"
version = "0.2.0"

[profile.release]
opt-level = 3
lto = "thin"
