name: Docs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Build API docs
      run: |
        MODULES="geometrykit $(python3 -c "import pkgutil, geometrykit; print(' '.join(m.name for m in pkgutil.walk_packages(geometrykit.__path__, prefix='geometrykit.')))")"
        pdoc $MODULES -o docs/_build -t docs/pdoc_templates

    - name: Upload to Pages
      id: upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build

    - name: Deploy to Pages
      id: deployment
      uses: actions/deploy-pages@v4
