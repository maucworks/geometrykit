name: tests

# The suite train in both engine configurations. The oracle (OCCT)
# environment stays local by design: pythonocc-core is conda-only and
# pinned out of CI scope; everything else runs here.

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: pytest ${{ matrix.os }} engine=${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        engine: [npu, rust]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.engine == 'rust'
      - name: Install (editable; engine built via maturin when rust)
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          if [[ "${{ matrix.engine }}" == "rust" ]]; then
            python -m pip install "maturin>=1,<2"
            python scripts/build_rust_extension.py
          fi
      - name: Suite (engine=${{ matrix.engine }})
        env:
          GEOMETRYKIT_ENGINE: ${{ matrix.engine }}
        run: python -m pytest tests/ -q
      - name: Boundary
        if: matrix.engine == 'npu' && matrix.os == 'ubuntu-latest'
        run: python tools/check_boundary.py
