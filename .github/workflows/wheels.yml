name: wheels

# Precompiled accelerator wheels: one release publishes the matrix of
# platform wheels (each carrying the compiled geometrykit._rust core)
# plus the pure setuptools wheel as the universal fallback. The
# assembly route is scripts/assemble_wheel.py (pure wheel -> inject
# the extension, rewrite the WHEEL tag, regenerate RECORD), needing
# only cargo plus the script per platform. Publishes on a `v*` tag via
# twine with the PyPI API token in repository settings (secret:
# PYPI_API_TOKEN).

on:
  push:
    branches:
      - master          # feature-branch pushes run nothing; their PR
      - release/**      # run covers the head state
  pull_request:
    paths:
      - "crates/**"
      - "scripts/assemble_wheel.py"
      - "scripts/build_rust_extension.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64 -> manylinux_2_28 tag
            platform_tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm     # aarch64
            platform_tag: manylinux_2_28_aarch64
          - os: macos-latest         # arm64 (Rhino 8 Mac Apple Silicon)
            platform_tag: macosx_11_0_arm64
          - os: macos-15-intel       # x86_64 (Rhino 8 Mac Intel)
            platform_tag: macosx_11_0_x86_64
          - os: windows-latest       # x64 (Rhino 8's primary platform;
                                     # the extension is named _rust.pyd)
            platform_tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + assemble the platform wheel
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install build
          python scripts/assemble_wheel.py --platform-tag ${{ matrix.platform_tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wip/wheelhouse/*.whl

  publish:
    name: publish to PyPI (binary matrix + pure wheel + sdist)
    # dispatch is allowed too: it is how a release whose publish job was
    # lost (e.g. v0.5.0) publishes retroactively, from fresh legs
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pure fallback wheel + sdist (setuptools route)
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m build --wheel
      - name: Collect the built platform wheels
        uses: actions/download-artifact@v4
        with:
          path: allwheels
      - name: Check
        run: |
          python -m pip install twine
          # download-artifact mirrors the workspace-relative structure the
          # artifacts were patterned from; flatten whatever came back. The
          # pure wheel is excluded: dist/ already carries it, and a second
          # upload of the same file is PyPI's 400 "already exists".
          mkdir -p metadist
          find allwheels -name "*.whl" ! -name "*py3-none-any*" \
              -exec cp {} metadist/ \;
          twine check dist/* metadist/*.whl
      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose --non-interactive dist/* metadist/*.whl
