name: wheels

# Precompiled accelerator wheels: one release publishes the matrix of
# hand-assembled ABI3 wheels (each carrying the compiled
# geometrykit._rust core for its platform) plus the pure setuptools
# wheel as the universal fallback. The assembly route is
# scripts/assemble_wheel.py (pure wheel -> inject the extension,
# rewrite the WHEEL tag, regenerate RECORD), needing only cargo plus
# the script per platform. Publishes on a `v*` tag via twine with the
# PyPI API token in repository settings (secret: PYPI_API_TOKEN).

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64 -> manylinux_2_28 tag
            platform_tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm     # aarch64
            platform_tag: manylinux_2_28_aarch64
          - os: macos-latest         # arm64 (Rhino 8 Mac Apple Silicon)
            platform_tag: macosx_11_0_arm64
          - os: macos-15-intel       # x86_64 (Rhino 8 Mac Intel)
            platform_tag: macosx_11_0_x86_64
          - os: windows-latest       # x64 (Rhino 8's primary platform;
                                     # the extension is named _rust.pyd)
            platform_tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + assemble the platform wheel
        shell: bash
        env:
          # keep the manylinux tag honest: the policy allows libgcc_s,
          # libc/libm/libdl/libpthread, which is all a Rust cdylib needs
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install build
          python scripts/assemble_wheel.py --platform-tag ${{ matrix.platform_tag }}
      - name: Wheel smoke test (binary engine selected + parity)
        shell: python
        run: |
          import glob
          import subprocess
          import sys
          wheel = glob.glob("wip/wheelhouse/*cp39-abi3-*.whl")[0]
          sys.exit(subprocess.call([sys.executable, "-m", "pip",
                                    "install", "--quiet", wheel, "--force-reinstall"]))
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wip/wheelhouse/*.whl
